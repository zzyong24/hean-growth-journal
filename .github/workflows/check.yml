name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix mobile ci && npm --prefix server ci
      - run: npm run check
      - run: npm run build
      - run: python3 devices/xiaoling/agent/bootstrap.py
      - run: npm ci && npm run typecheck && npm test
        working-directory: devices/xiaoling/agent
